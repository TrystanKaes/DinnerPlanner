# Settings for Backend (on Cloud Run).
# See https://firebase.google.com/docs/app-hosting/configure#cloud-run
runConfig:
  minInstances: 0
  # maxInstances: 100
  # concurrency: 80
  # cpu: 1
  # memoryMiB: 512

# Environment variables and secrets.
# Create secrets with: firebase apphosting:secrets:set SECRET_NAME
# See https://firebase.google.com/docs/app-hosting/configure#secret-parameters
env:
  # Skip T3 env validation during build.
  - variable: SKIP_ENV_VALIDATION
    value: "1"
    availability:
      - BUILD

  # Database (required for BUILD and RUNTIME)
  - variable: DATABASE_URL
    secret: DATABASE_URL
    availability:
      - BUILD
      - RUNTIME

  # Clerk (required for BUILD - Next.js inlines NEXT_PUBLIC_* at build time)
  - variable: CLERK_SECRET_KEY
    secret: CLERK_SECRET_KEY
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
    secret: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_CLERK_SIGN_IN_URL
    value: "/sign-in"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_CLERK_SIGN_UP_URL
    value: "/sign-up"
    availability:
      - BUILD
      - RUNTIME

  # Anthropic AI (required for shopping list consolidation, recipe import)
  - variable: ANTHROPIC_API_KEY
    secret: ANTHROPIC_API_KEY
    availability:
      - BUILD
      - RUNTIME
